- id: forms.textarea.resize
  title: Textareas are not user-resizable
  why: >
    A resize handle lets one field push the surrounding layout out of the grid and
    produces a different form height every session. Height is a design decision made
    per content type (rows), not by the user. Projects that need user resizing set
    params.resize to "vertical" — never "both" or horizontal, which break column widths.
  severity: error
  params:
    resize: none # none | vertical
  do: |
    import { TextareaField } from "@/components/fcs/textarea-field";

    <TextareaField label="Note" name="note" rows={4} />
  dont: |
    <textarea className="resize-y" />
    <Textarea className="resize" />   // shadcn primitive used directly in a page
  enforce:
    component: "@fcs/textarea-field"
    lint: [fcs/no-raw-textarea]
